name = "jeeves"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[vars]
ANSWER_MODEL = "claude-sonnet-5-5"
PUBLIC_BASE_URL = "https://jeeves.it-230.workers.dev"   # switch to jeeves.mercijets.com if you add a custom domain

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "jeeves"
database_id = "d82c610d-9993-464a-9a05-06bf4d56a7a7"

[[vectorize]]
binding = "VEC"
index_name = "jeeves"

[[r2_buckets]]
binding = "FILES"
bucket_name = "jeeves-library"

# Secrets (set with `npx wrangler secret put NAME`, never in this file):
#   ANTHROPIC_API_KEY      Claude API key
#   SLACK_SIGNING_SECRET   from the Slack app's Basic Information page
#   SLACK_BOT_TOKEN        xoxb-... from OAuth & Permissions
#   LINK_SECRET            any long random string; signs "View page" links
#   API_TOKEN              any long random string; protects /api/ask and /mcp
