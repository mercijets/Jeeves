name: Sync Jeeves library

on:
  schedule:
    - cron: "17 * * * *"        # hourly, at :17
  workflow_dispatch:
    inputs:
      force:
        description: "Re-index every document"
        type: boolean
        default: false

concurrency:
  group: jeeves-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # a full re-index of ~3,000 pages takes about an hour
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r ingest/requirements.txt
      - name: Sync Drive → Cloudflare
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          JEEVES_SHARED_DRIVE_ID: ${{ secrets.JEEVES_SHARED_DRIVE_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          VECTORIZE_INDEX: jeeves
          R2_BUCKET: jeeves-library
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SLACK_UPDATES_WEBHOOK: ${{ secrets.SLACK_UPDATES_WEBHOOK }}
        run: python -m ingest.sync ${{ inputs.force && '--force' || '' }}
